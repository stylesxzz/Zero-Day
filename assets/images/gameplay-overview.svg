  <text x="48" y="773" fill="#ffbe55">T0136</text><text x="105" y="773" fill="#d1e3e5">Volatilidade elevada.</text>
  <text x="48" y="814" fill="#00ff9c">T0132</text><text x="105" y="814" fill="#d1e3e5">Novo agente no laboratório.</text>
</g>
