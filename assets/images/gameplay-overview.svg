<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Zéro Day — demonstração da interface de gameplay</title>
<desc id="desc">Mockup da interface com painel de capital, torre isométrica, mapa de andares, agentes e mercado simulado.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#061018"/><stop offset="1" stop-color="#02070c"/></linearGradient>
  <linearGradient id="tower" x2="1" y2="0"><stop stop-color="#0c2832"/><stop offset=".55" stop-color="#17434a"/><stop offset="1" stop-color="#07151e"/></linearGradient>
  <linearGradient id="green" x2="1" y2="1"><stop stop-color="#00ff9c"/><stop offset="1" stop-color="#00a8c7"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#14323a" stroke-width="1" opacity=".38"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#grid)"/>
<rect x="0" y="0" width="1600" height="82" fill="#07121a" stroke="#19434c"/>
<path d="M35 20h28l-18 22h26l-41 30 11-23H19z" fill="#00ff9c"/>
<text x="83" y="42" font-family="Arial" font-size="30" font-weight="800" fill="#efffff">ZÉRO DAY</text>
<text x="85" y="65" font-family="monospace" font-size="12" fill="#00ff9c" letter-spacing="4">SWARM TRADING / LIVE SIMULATION</text>
